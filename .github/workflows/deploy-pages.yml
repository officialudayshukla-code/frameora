name: Deploy to GitHub Pages

# GitHub Pages serves static files only, so this builds the site with
# `NEXT_OUTPUT=export` and publishes `out/`. The origin is supplied here rather
# than baked into the source, so a custom domain later is a one-line change in
# repository variables (see README).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NEXT_PUBLIC_SITE_URL: https://officialudayshukla-code.github.io/frameora

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          NEXT_OUTPUT: export

      # A project site lives under /<repo>, and Pages must not run the output
      # through Jekyll, which would drop `_next/`.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
